# Communauté d'Onde : chaque post envoyé depuis l'app arrive en "issue",
# ce robot le vérifie, l'ajoute à community/posts.json puis ferme l'issue.
name: Communauté

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: communaute
  cancel-in-progress: false

jobs:
  traiter:
    if: contains(github.event.issue.body, '<!-- onde-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: run
        run: python3 .github/scripts/community.py

      - name: Enregistrer
        if: steps.run.outputs.changed == 'true'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "onde-communaute[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/posts.json
          git commit -m "Communauté : issue #$NUM"
          for i in 1 2 3 4; do git push && break; sleep 3; git pull --rebase; done

      - name: Fermer l'issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          MSG: ${{ steps.run.outputs.message }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "${MSG:-Erreur de traitement.}"
