  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></symbol>
  <symbol id="i-listplus" viewBox="0 0 24 24"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"/></symbol>

<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app" id="app">
  <aside class="side panel">
    <div class="brand">
      <img src="/icon.svg" alt="" class="brand-logo">
      <span class="brand-name">Onde</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-head">
      <span>Playlists</span>
      <button class="icon-btn sm" data-act="new-playlist" title="Nouvelle playlist"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div class="playlists" id="playlists"></div>
    <div class="side-foot">
      <button class="ghost-btn" data-act="settings"><svg class="i"><use href="#i-settings"/></svg>Paramètres</button>
      <button class="ghost-btn" data-act="reveal"><svg class="i"><use href="#i-folder"/></svg>Ouvrir le dossier des sons</button>
      <button class="ghost-btn" data-act="spotify-login"><svg class="i"><use href="#i-spotify"/></svg>Connexion Spotify</button>
    </div>
  </aside>

  <main class="main panel">
    <header class="top">
      <label class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Rechercher un son, un artiste…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="top-actions">
        <button class="btn" data-act="add-files"><svg class="i"><use href="#i-upload"/></svg>Fichiers</button>
        <button class="btn" data-act="add-folder"><svg class="i"><use href="#i-folder"/></svg>Dossier</button>
        <button class="btn primary" data-act="add-link"><svg class="i"><use href="#i-link"/></svg>Ajouter un lien</button>
        <button class="profile-chip" id="profileChip" data-act="account" title="Mon compte"></button>
      </div>
    </header>
    <div class="update-banner" id="updateBanner" hidden></div>
    <div class="content" id="content"></div>
  </main>

  <section class="now panel" id="now">
    <div class="now-head">
      <span class="eyebrow">En lecture</span>
      <div class="now-head-actions">
        <button class="icon-btn sm" data-act="immersive" title="Mode immersif (F)"><svg class="i"><use href="#i-expand"/></svg></button>
        <button class="icon-btn sm only-drawer" data-act="toggle-now" title="Fermer"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="stage" id="stage" data-engine="none">
      <div class="stage-cover" id="stageCover"></div>
      <video id="media" playsinline preload="auto"></video>
      <div class="yt-wrap"><div id="yt-host"></div></div>
      <div class="sp-wrap"><div id="sp-host"></div></div>
      <canvas id="viz"></canvas>
    </div>
    <div class="now-meta">
      <div class="now-text">
        <div class="now-title" id="nowTitle">Rien en lecture</div>
        <div class="now-artist" id="nowArtist">Ajoute des sons pour commencer</div>
      </div>
      <button class="icon-btn heart" id="nowFav" data-act="fav-current" title="Favori"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="track-vol" title="Volume propre à ce son, mémorisé pour la prochaine fois">
      <svg class="i"><use href="#i-vol"/></svg>
      <span class="tv-label">Ce son</span>
      <input type="range" id="trackVol" min="0" max="300" step="5" value="100" class="range vol" aria-label="Volume de ce son">
      <span class="tv-pct" id="trackVolPct">100%</span>
      <button class="link-btn" id="trackVolReset" title="Remettre à 100 %">↺</button>
    </div>
    <div class="upnext">
      <div class="upnext-head"><span>À suivre</span><button class="link-btn" data-act="clear-queue">Vider</button></div>
      <div class="upnext-list" id="upnext"></div>
    </div>
  </section>

  <footer class="bar panel" id="bar">
    <div class="bar-left">
      <div class="bar-cover" id="barCover"></div>
      <div class="bar-text">
        <div class="bar-title" id="barTitle">—</div>
        <div class="bar-artist" id="barArtist"></div>
      </div>
      <button class="icon-btn heart sm" id="barFav" data-act="fav-current" title="Favori"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="bar-center">
      <div class="controls">
        <button class="icon-btn sm toggle" id="btnShuffle" data-act="shuffle" title="Aléatoire (S)"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" data-act="prev" title="Précédent (Maj+←)"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="btnPlay" data-act="toggle" title="Lecture / Pause (Espace)"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-act="next" title="Suivant (Maj+→)"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="icon-btn sm toggle" id="btnRepeat" data-act="repeat" title="Répéter (R)"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="progress">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" class="range" aria-label="Position">
        <span class="time" id="tDur">0:00</span>
      </div>
    </div>
    <div class="bar-right">
      <span class="src-pill" id="srcPill"></span>
      <button class="icon-btn sm" data-act="toggle-now" title="En lecture"><svg class="i"><use href="#i-panel"/></svg></button>
      <button class="icon-btn sm" id="btnMute" data-act="mute" title="Muet (M)"><svg class="i"><use href="#i-vol"/></svg></button>
      <input type="range" id="vol" min="0" max="300" value="80" step="5" class="range vol" aria-label="Volume (jusqu'à 300 %)">
      <span class="vol-pct" id="volPct">80%</span>
      <button class="icon-btn sm" data-act="immersive" title="Mode immersif (F)"><svg class="i"><use href="#i-expand"/></svg></button>
    </div>
  </footer>
</div>

<div class="drop" id="drop"><div class="drop-inner"><svg class="i"><use href="#i-upload"/></svg><b>Lâche tes sons ici</b><span>MP3, MP4, M4A, FLAC, WAV… ou un lien YouTube / Spotify</span></div></div>
<div class="menu" id="menu" role="menu"></div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts"></div>
<input type="file" id="pickFiles" multiple accept="audio/*,video/*,.mp3,.mp4,.m4a,.flac,.wav,.ogg,.opus,.webm,.mkv,.mov" hidden>

<script src="/app.js"></script>
</body>
</html>
